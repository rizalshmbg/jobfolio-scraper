[project]
name = "jobfolio-scraper"
version = "1.0.0"
description = "JobFolio job scraper service"
requires-python = ">=3.14,<3.15"

dependencies = [
    "fastapi[standard]",
    "httpx",
    "beautifulsoup4",
    "pydantic-settings",
    "google-genai",
    "python-docx",
    "pypdf",
]

[tool.fastapi]
entrypoint = "app.main:app"